name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://creatorops:change-me@localhost:5432/creatorops
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatorops
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: creatorops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorops -d creatorops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code -- infra/migrations
          test -z "$(git status --porcelain -- infra/migrations)"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
