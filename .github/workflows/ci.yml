# TODO before the first release: pin each third-party action to a full commit SHA.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://creatorops:change-me@localhost:5432/creatorops
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatorops
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: creatorops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorops -d creatorops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrations are up to date
        run: |
          pnpm db:generate
          git diff --exit-code -- infra/migrations
          test -z "$(git status --porcelain -- infra/migrations)"

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (dashboard and extension)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatorops
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: creatorops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatorops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://creatorops:change-me@localhost:5432/creatorops
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @creatorops/web exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/extension/test-results
          if-no-files-found: ignore

  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    # gitleaks lists the commits of a pull request, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
