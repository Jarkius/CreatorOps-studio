# Local development PostgreSQL 16.
#
# The credentials below are local-dev placeholders, not secrets. Do not reuse
# them anywhere else. The app reads its connection string from DATABASE_URL:
#   postgres://creatorops:change-me@localhost:5432/creatorops
#
# Usage: docker compose -f infra/docker/docker-compose.yml up -d postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creatorops
      POSTGRES_PASSWORD: change-me # local-dev placeholder
      POSTGRES_DB: creatorops
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creatorops -d creatorops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
